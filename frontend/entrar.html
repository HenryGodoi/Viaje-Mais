<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E3B2B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Entrar — Viaje Mais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="auth">
  <section class="lado">
    <a class="logo" href="/" style="text-decoration:none;color:inherit"><img class="logo-img chip" src="/img/logo.png" alt="Viaje Mais Experiências"></a>
    <div><div class="regiao">Quarta Colônia, Rio Grande do Sul</div>
      <h1 id="titulo-lado">Descubra destinos e viva experiências</h1>
      <p>Entre para salvar destinos, montar roteiros e planejar sua viagem pela região.</p></div>
    <div></div>
  </section>
  <section class="form">
    <div class="card">
      <div class="abas" role="tablist">
        <button role="tab" id="aba-entrar" aria-selected="true">Entrar</button>
        <button role="tab" id="aba-criar" aria-selected="false">Criar conta</button>
      </div>
      <h2 id="h">Bem-vindo de volta</h2>
      <p class="sub" id="sub">Entre com seu e-mail e senha para continuar.</p>
      <button class="btn sec google" id="google" type="button">
        <svg width="22" height="22" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span id="google-txt">Continuar com Google</span></button>
      <div class="div" id="ou">ou entre com e-mail</div>
      <form id="f" class="card" style="gap:16px" novalidate>
        <div class="cad hidden campo"><input id="nome" autocomplete="name" placeholder=" "><label for="nome">Nome completo</label></div>
        <div class="campo"><input id="email" type="email" autocomplete="email" placeholder=" "><label for="email">E-mail</label></div>
        <div class="campo"><input id="senha" type="password" autocomplete="current-password" placeholder=" "><label for="senha">Senha</label></div>
        <div class="cad hidden campo"><input id="conf" type="password" autocomplete="new-password" placeholder=" "><label for="conf">Confirmar senha</label></div>
        <div class="cad hidden perfis" role="radiogroup" aria-label="Tipo de conta">
          <label><input type="radio" name="perfil" value="cliente" checked> Quero viajar</label>
          <label><input type="radio" name="perfil" value="operador"> Ofereço turismo</label>
        </div>
        <div class="msg" id="msg" role="alert"></div>
        <button class="btn" id="ok" type="submit">Entrar</button>
      </form>
    </div>
  </section>
</div>
<script src="/js/entrar.js"></script>
</body>
</html>
